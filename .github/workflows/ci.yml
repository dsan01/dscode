
name: DSCode CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Astro
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro
        run: pnpm build
        env:
          STRAPI_URL: ${{ vars.STRAPI_URL }}
          CAP_URL: ${{ vars.CAP_URL }}
          CAP_SITE: ${{ vars.CAP_SITE }}
          EASTER_CODE: ${{ vars.EASTER_CODE }}
          UMAMI_URL: ${{ vars.UMAMI_URL }}
          UMAMI_CODE: ${{ vars.UMAMI_CODE }}
